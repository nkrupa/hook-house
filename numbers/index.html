<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Hook House Daily Numbers</title>
<style>
  body { margin: 0; font: 16px Montserrat, system-ui, sans-serif; background: #0A0E2E; color: #F4EDDC; padding: 0 16px; display: grid; place-items: center; min-height: 100vh; }
  .box { width: min(340px, 90vw); display: grid; gap: 12px; text-align: center; }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: #A9AECB; font-size: 14px; }
  input { font: inherit; padding: 12px; border: 1px solid #262E66; border-radius: 8px; text-align: center; background: #131A46; color: #F4EDDC; }
  button { font: inherit; padding: 12px; border: 0; border-radius: 8px; background: #22C3E6; color: #0A0E2E; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form class="box" id="ask" hidden>
  <h1>Hook House Daily Numbers</h1>
  <p>First time on this phone: what's your name?</p>
  <input id="name" autocomplete="given-name" placeholder="Your name" required>
  <button type="submit">Open the numbers</button>
  <p>We log visits to this page. You'll only be asked once.</p>
</form>
<p class="box" id="go" hidden>Opening the numbers…</p>
<script>
(function () {
  var TARGET = 'https://claude.ai/artifact/76xdi6hsG8R8xLUe1zUSBB';
  var LOGGER = 'https://script.google.com/macros/s/AKfycbzTJG77S_8IlDEy6yR6huygClsnekZIOOIsNuyqY3ZTl5Fqx51D2MeaOOrEcarhWLPP/exec';
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function deviceId() {
    var id = store.get('hhk_device_id');
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      store.set('hhk_device_id', id);
    }
    return id;
  }
  function describe() {
    var ua = navigator.userAgent;
    var device = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'Other';
    var browser = /CriOS|Chrome/.test(ua) && !/Edg/.test(ua) ? 'Chrome' : /Edg/.test(ua) ? 'Edge' : /FxiOS|Firefox/.test(ua) ? 'Firefox' : /Safari/.test(ua) ? 'Safari' : 'Other';
    return {device: device, browser: browser};
  }
  function logAndGo(name) {
    document.getElementById('ask').hidden = true;
    document.getElementById('go').hidden = false;
    var d = describe();
    var body = JSON.stringify({name: name, device_id: deviceId(), device: d.device, browser: d.browser, page: location.pathname, referrer: document.referrer});
    var sent = false;
    try { sent = navigator.sendBeacon(LOGGER, new Blob([body], {type: 'text/plain'})); } catch (e) {}
    if (!sent) { try { fetch(LOGGER, {method: 'POST', mode: 'no-cors', body: body, keepalive: true}); } catch (e) {} }
    setTimeout(function () { location.replace(TARGET); }, 400);
  }
  var saved = store.get('hhk_name');
  if (saved) { logAndGo(saved); return; }
  var form = document.getElementById('ask');
  form.hidden = false;
  document.getElementById('name').focus();
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var n = document.getElementById('name').value.trim();
    if (!n) return;
    store.set('hhk_name', n);
    logAndGo(n);
  });
})();
</script>
</body>
</html>
